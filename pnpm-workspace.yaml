packages:
  - "apps/*"
  - "packages/*"

# pnpm 11은 postinstall 스크립트를 기본 차단한다. esbuild(tsx, drizzle-kit이 사용)만 허용.
# 예전 키 onlyBuiltDependencies는 pnpm 11에서 무시되고 allowBuilds로 바뀌었다.
allowBuilds:
  esbuild: true

# pnpm 11은 출시 24시간(minimumReleaseAge 1440분) 안 된 버전을 설치하지 않는다.
# 공급망 보호용이다. 막히면 하루 기다리거나 한 버전 전을 쓴다. 예외(minimumReleaseAgeExclude)는 두지 않는다.
